<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@700&family=Inter:wght@400;600&display=block" />
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #E4FE5B; color: #151902; font-family: Inter, sans-serif; box-sizing: border-box;
    display: grid; grid-template-columns: 1fr 660px; align-items: center; gap: 120px; padding: 0 160px;
  }
  .step { font-weight: 600; font-size: 28px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; margin-bottom: 24px; }
  h1 { font: 700 104px/1.02 Barlow, sans-serif; margin: 0 0 32px; }
  p { font-size: 38px; line-height: 1.4; margin: 0; max-width: 820px; }
  .window {
    width: 400px; height: 600px; transform: scale(1.6); transform-origin: center; justify-self: center;
    border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 24px 60px rgba(21, 25, 2, .22), 0 0 0 1px rgba(21,25,2,.08);
  }
  .bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font: 600 13px Inter, sans-serif; border-bottom: 1px solid #E5E5E5; }
  .bar i { width: 18px; height: 18px; border-radius: 4px; background: #151902; display: inline-block; }
  iframe { width: 400px; height: 560px; border: 0; display: block; }
</style>
</head>
<body>
  <div>
    <div class="step" id="step"></div>
    <h1 id="title"></h1>
    <p id="body"></p>
  </div>
  <div class="window">
    <div class="bar"><i></i>Noto Emoji Picker</div>
    <iframe id="ui" src="../dist/ui.html"></iframe>
  </div>
  <script>
    const slides = {
      1: {
        title: "Find any emoji in a few keystrokes",
        body: "Rich tags from CLDR, GitHub, Slack and hand-picked slang. Try “lol”, “ship it” or “uk”, or just paste an emoji.",
        run: async (w, d) => { await type(d, "party"); hover(d, 0); },
      },
      2: {
        title: "Classic 2D or the new 3D look",
        body: "Switch styles in one click. 2D lands as editable vectors; 3D as crisp 512px images.",
        run: async (w, d) => { d.querySelector('[data-style="3d"]').click(); await wait(300); hover(d, 7); },
      },
      3: {
        title: "Animated, with skin tones",
        body: "Turn on Animated to see the ~600 emoji that move. Pick a skin tone, choose a size, then click or drag onto the canvas.",
        run: async (w, d) => {
          d.querySelector('[data-anim="1"]').click(); d.querySelectorAll("#tones button")[3].click();
          await type(d, "wave"); hover(d, 0);
        },
      },
    };
    const n = new URLSearchParams(location.search).get("slide") || "1";
    const s = slides[n];
    document.getElementById("step").textContent = `${n} / 3`;
    document.getElementById("title").textContent = s.title;
    document.getElementById("body").textContent = s.body;

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    async function type(d, q) {
      const i = d.getElementById("search"); i.value = q; i.dispatchEvent(new Event("input")); await wait(300);
    }
    function hover(d, idx) {
      d.querySelectorAll(".tile")[idx]?.dispatchEvent(new MouseEvent("mouseover", { bubbles: true }));
    }
    document.getElementById("ui").addEventListener("load", async (ev) => {
      const w = ev.target.contentWindow, d = w.document;
      await wait(500);
      await s.run(w, d);
      d.activeElement?.blur();
    });
  </script>
</body>
</html>
